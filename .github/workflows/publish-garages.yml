name: Publish Garage Data

on:
  schedule:
    # Weekly, as a reminder to re-verify stale entries
    - cron: '0 3 * * 1'
  workflow_dispatch:
  push:
    paths:
      - garages-source.json
      - garages_v2.json
      - index.html
      - garages.html
      - garages-de.html
      - schema.json
      - build.py

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify generated files are up to date
        run: |
          cp garages_v2.json /tmp/garages_v2.json
          python3 build.py
          diff /tmp/garages_v2.json garages_v2.json

      - name: Validate against schema
        run: |
          pip install --quiet jsonschema
          python3 - <<'EOF'
          import json, jsonschema
          schema = json.load(open('schema.json'))
          for f in ('garages-source.json', 'garages_v2.json'):
              jsonschema.validate(json.load(open(f)), schema)
              print(f, 'valid')
          garages = json.load(open('garages_v2.json'))['garages']
          assert all(e.get('r') == 1 or e.get('d') for e in garages), 'published set contains unconfirmed entries'
          print(len(garages), 'garages published')
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage pages artifact
        run: |
          mkdir -p _pages
          cp garages_v2.json schema.json _pages/
          cp index.html garages.html garages-de.html _pages/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # The homepage renders this data into /garages/ and only picks it up on its
      # own build, so nudge it once the new garages_v2.json is live on Pages.
      - name: Check dispatch credentials
        id: dispatch
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APP_PRIVATE_KEY is not set for this repository; the homepage /garages/ rebuild was not triggered and will stay stale until it rebuilds for another reason"
          fi

      - name: Generate app token for site rebuilds
        if: steps.dispatch.outputs.enabled == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: librescoot
          repositories: librescoot.github.io

      - name: Trigger homepage rebuild
        if: steps.dispatch.outputs.enabled == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: librescoot/librescoot.github.io
          event-type: garages-changed
